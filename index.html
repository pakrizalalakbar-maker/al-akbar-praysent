<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#10b981" />
    <title>Al-Akbar Praysent - Presensi Shalat</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; overscroll-behavior-y: none; }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      /* SCANNER CONTAINER STYLES */
      #reader {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 0.75rem;
        overflow: hidden;
      }

      #reader video {
        object-fit: cover;
        width: 100%;
        height: 100%;
        border-radius: 0.75rem;
      }

      /* CETAK BARCODE: saat print, sembunyikan semua elemen kecuali area cetak */
      @media print {
        body * { visibility: hidden; }
        #printable-barcodes, #printable-barcodes * { visibility: visible; }
        #printable-barcodes {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
